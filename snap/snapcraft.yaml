name: wayland-session-recorder
base: core24
version: '0.1.0'
summary: Isolated headless Wayland & PipeWire session recorder
description: |
  Spins up an isolated Weston compositor with a PipeWire video stream and
  virtual PipeWire audio sink to capture GUI application runs and automated
  browser tests into synchronized H.264/AAC MP4 artifacts.

grade: stable
confinement: strict

apps:
  wayland-rec:
    command: bin/wayland-rec
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/weston:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libweston-14
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      WESTON_MODULE_MAP: ""
    plugs:
      - wayland
      - audio-playback
      - audio-record
      - home
      - network

  wayland-rec-ui:
    command: bin/wayland-rec-ui
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/weston:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libweston-13:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libweston-14
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      WESTON_MODULE_MAP: ""
    plugs:
      - wayland
      - audio-playback
      - audio-record
      - home
      - network
      - network-bind

parts:
  wayland-rec:
    plugin: python
    source: .
    stage-packages:
      - weston
      - pipewire-bin
      - pipewire-pulse
      - pulseaudio-utils
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-pipewire
      - gstreamer1.0-pulseaudio

